name: CMake

on: [push, pull_request]

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally
    # well on Windows or Mac.  You can convert this to a matrix build if you need
    # cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: gcc-cpp17-release
          build_type: Release
          compiler_packages: --extra-package gcc --extra-package g++
          cc: gcc
          cxx: g++
          cmake_options: --option=-DUSE_PCH=ON
        - name: clang-debug
          build_type: Debug
          compiler_packages: --extra-package clang
          cc: clang
          cxx: clang++
          cmake_options: ""

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Create Build Environment
      run: python3 .github/scripts/cmake.py mkdir --path ${{ runner.workspace }}/build

    - name: Download minimal cd image
      run: python3 .github/scripts/cmake.py minimal --output ${{ github.workspace }}/data/cd.iso

    - name: Install dependencies
      run: python3 .github/scripts/cmake.py install --profile build ${{ matrix.compiler_packages }}

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: ccache-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt', 'cmake/**/*.cmake') }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ matrix.name }}-

    - name: Configure ccache
      run: python3 .github/scripts/cmake.py ccache

    - name: Compiler version check
      run: python3 .github/scripts/cmake.py compilers --name ${{ matrix.name }} --cc ${{ matrix.cc }} --cxx ${{ matrix.cxx }}

    - name: Configure CMake
      run: >
        python3 .github/scripts/cmake.py configure
        --source ${{ github.workspace }}
        --build-dir ${{ runner.workspace }}/build
        --build-type ${{ matrix.build_type }}
        --cc ${{ matrix.cc }}
        --cxx ${{ matrix.cxx }}
        ${{ matrix.cmake_options }}

    - name: Build
      run: python3 .github/scripts/cmake.py build --build-dir ${{ runner.workspace }}/build --config ${{ matrix.build_type }}

    - name: Show ccache stats
      run: python3 .github/scripts/cmake.py stats

    - name: Check source data tree stays clean
      run: python3 .github/scripts/hygiene.py data

    - name: Test
      run: python3 .github/scripts/cmake.py test --build-dir ${{ runner.workspace }}/build --config ${{ matrix.build_type }}

    - name: Upload failure logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: cmake-logs-${{ matrix.name }}
        if-no-files-found: warn
        path: |
          ${{ runner.workspace }}/build/Testing/Temporary/LastTest.log
          ${{ runner.workspace }}/build/CMakeFiles/CMakeOutput.log
          ${{ runner.workspace }}/build/CMakeFiles/CMakeError.log
