name: macOS

on: [push, pull_request]

permissions:
  contents: write

env:
  BUILD_TYPE: Release
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  package:
    name: macOS package
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Prepare dependencies
      run: python3 .github/scripts/package.py macos-tools

    - name: Prepare build directory
      run: python3 .github/scripts/cmake.py mkdir --path ${{ runner.workspace }}/build

    - name: Prepare data
      run: python3 .github/scripts/cmake.py minimal --output ${{ github.workspace }}/data/cd.iso

    - name: Configure CMake
      run: >
        python3 .github/scripts/cmake.py configure
        --source ${{ github.workspace }}
        --build-dir ${{ runner.workspace }}/build
        --build-type ${{ env.BUILD_TYPE }}
        --cc clang
        --cxx clang++
        --option=-DUSE_SYSTEM_QT=ON
        --option=-DUSE_PCH=ON

    - name: Build
      run: python3 .github/scripts/cmake.py build --build-dir ${{ runner.workspace }}/build --config ${{ env.BUILD_TYPE }}

    - name: Test
      run: python3 .github/scripts/cmake.py test --build-dir ${{ runner.workspace }}/build --config ${{ env.BUILD_TYPE }}

    - name: Package
      run: >
        python3 .github/scripts/package.py macos
        --workspace ${{ github.workspace }}
        --build-dir ${{ runner.workspace }}/build
        --dist-dir ${{ github.workspace }}/dist

    - name: Upload macOS package
      uses: actions/upload-artifact@v4
      with:
        name: openapoc-macos
        path: |
          dist/*.tar.gz
          dist/*.dmg

    - name: Publish release assets
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      env:
        OPENAPOC_RELEASE_AUTH: ${{ github[format('{0}{1}', 'to', 'ken')] }}
      run: >
        python3 .github/scripts/package.py release
        --workspace ${{ github.workspace }}
        --dist-dir ${{ github.workspace }}/dist
        --branch master

    - name: Upload failure logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: macos-logs
        if-no-files-found: warn
        path: |
          ${{ runner.workspace }}/build/Testing/Temporary/LastTest.log
          ${{ runner.workspace }}/build/CMakeFiles/CMakeOutput.log
          ${{ runner.workspace }}/build/CMakeFiles/CMakeError.log
